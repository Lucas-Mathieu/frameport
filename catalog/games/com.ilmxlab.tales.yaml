package: com.ilmxlab.tales
title: 'Star Wars: Tales from the Galaxy''s Edge'
status: works
notes: >-
  Headset tested for GitHub issue 61: full view, loading into gameplay, both eyes, controller input and sound
  work with the splash bypass and multiview depth-size fix. Keep the main OBB and all three content/sound-bank PAKs.
  GitHub issue 369 (headset, Lepton 3.0.5): the GPU hang at a later loading screen is fixed by zink_shader_fix;
  played ~28 min at 72 fps.
details: Unreal Engine 4 (GLES) by ILMxLAB, like Vader Immortal, but a different engine build - it has none of Vader's
  Quest-only branches (no GetQuestShaderPrecompilePercent or RPOC key map; it precompiles shaders through Unreal's
  own pipeline cache), so frame.unreal_quest_precompile/_keymap don't apply. Its seasons and Wwise banks are Meta
  platform asset files (frame.asset_files). Vader's OVRPlugin findings apply to it as well - poses asked for at
  OVRPlugin's own clock (pose_time_fix) and thumbs from near-touch, which the Frame never reports (frame.unreal_thumb_touch).
  Map travel stalls with the game thread waiting in FlushRenderingCommands and the render thread waiting in
  FSplash::RenderFrame_RenderThread / ovrp_WaitToBeginFrame. frame.unreal_splash_bypass lets loading finish.
  SideQuest backups with sibling apk/ and obb/ folders must include all three PAKs; old scans omitted them and
  lost sound. The scanner and library refresh recover that layout. Eye clipping came from cached Android window
  dimensions for the depth attachment (1920x1016 versus the 1728x1728 eye color texture).
  frame.unreal_multiview_depth refreshes both cached dimensions from the current eye render size; multiview and
  multisampling remain enabled. The two engine fixes check exported symbols, function sizes and instruction bytes
  before changing one instruction each; unrecognized engine builds are left unchanged.
  A fragment shader (module 16800_8dbab031..., as Zink compiles it) reads 12 int loop counters/accumulators before
  setting them and hangs the GPU (kernel hangcheck) at a loading screen, the same bug as Vader Immortal's lightspeed
  shaders; the Vulkan layer under Zink inserts stores of 0 (frame.zink_shader_fix, zink_shader_fix). Captured with
  Lepton 3.0.5, so a Frame update that changes Zink's output stops it matching (the layer logs that).
