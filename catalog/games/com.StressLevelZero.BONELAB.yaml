package: com.StressLevelZero.BONELAB
title: BONELAB
status: works
notes: Head tracking and controls work with frame.unity_user_presence (tested with 1.2068.34555).
details: The game runs (72 fps), but its player body stayed frozen - no head tracking, the controllers stuck to the
  model, no buttons - although OpenXR input and OVRPlugin's poses were fine. A few seconds after start (when Unity
  switches XR loaders) OVRPlugin reports the worn headset as not worn (ovrp_GetUserPresent2 -> 0), and BONELAB's
  Marrow rig only follows the player while Unity's HMD device reports UserPresence (OpenControllerRig checks
  XRHMD.IsUserPresent every frame). frame.unity_user_presence reports the headset as worn. Build 1.2974 crashed
  earlier in vkCreateInstance from the game's own Vulkan hooks (libSLZQuestNative.so); not retested.
tested_version: 1.2068.34555
